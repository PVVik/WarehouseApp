<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Серийные единицы - WarehouseApp</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #2c3e50; margin-bottom: 20px; }
        .toolbar { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .btn { padding: 8px 16px; text-decoration: none; border-radius: 4px; font-weight: 600; cursor: pointer; border: none; }
        .btn-primary { background-color: #3498db; color: white; }
        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #2c3e50; }
        .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 0.8rem; }
        .st-NEW { background-color: #e2e3e5; color: #383d41; }
        .st-IN_STOCK { background-color: #d4edda; color: #155724; }
        .st-IN_USE { background-color: #cce5ff; color: #004085; }
        .st-IN_REPAIR { background-color: #fff3cd; color: #856404; }
        .st-WRITTEN_OFF { background-color: #f8d7da; color: #721c24; }
        .flash-message { padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .flash-success { background-color: #d4edda; color: #155724; }
        .flash-error { background-color: #f8d7da; color: #721c24; }
        select.status-select { padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Серийные единицы</h1>

    <div th:if="${successMessage}" class="flash-message flash-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="flash-message flash-error" th:text="${errorMessage}"></div>

    <div class="toolbar">
        <h2 th:if="${filterNomenclatureId}"
            th:text="'Позиция: ' + ${nomenclatureNames.get(filterNomenclatureId)}"></h2>
        <h2 th:unless="${filterNomenclatureId}">Все единицы</h2>

        <a th:href="@{/serial-item/form(nomenclatureId=${filterNomenclatureId})}"
           class="btn btn-primary">+ Добавить единицу</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Серийный номер</th>
            <th>Номенклатура</th>
            <th>Статус</th>
            <th>Паспорт</th>
            <th>Смена статуса</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${serialItemList}">
            <td th:text="${item.id}"></td>
            <td th:text="${item.serialNumber}"></td>
            <td th:text="${nomenclatureNames.get(item.nomenclatureId)}"></td>

            <td>
                <span th:class="'status-badge st-' + ${item.status}"
                      th:text="${item.status.label}"></span>
            </td>
            <td th:text="${item.passportNumber}"></td>

            <td>
                <form th:action="@{/serial-item/{id}/status(id=${item.id})}" method="post"
                      style="display:flex; gap:6px; align-items:center;">
                    <select name="status" class="status-select">
                        <option th:each="st : ${statuses}"
                                th:value="${st.name()}"
                                th:text="${st.label}"></option>
                    </select>
                    <button type="submit" class="btn btn-primary" style="padding: 4px 10px;">OK</button>
                </form>
            </td>

            <td>
                <a th:href="@{/serial-item/form/{id}(id=${item.id})}"
                   style="color:#3498db; margin-right: 10px;">Редактировать</a>
                <form th:action="@{/serial-item/{id}/delete(id=${item.id})}" method="post"
                      style="display:inline;"
                      onsubmit="return confirm('Удалить серийную единицу?');">
                    <button type="submit" class="btn"
                            style="background:none; color:#e74c3c; padding:0; text-decoration:underline;">
                        Удалить
                    </button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(serialItemList)}">
            <td colspan="7" style="text-align:center; color:#7f8c8d;">Список пуст</td>
        </tr>
        </tbody>
    </table>

    <div class="pagination" th:if="${totalPages > 1}">
        <a th:if="${currentPage > 0}"
           th:href="@{/serial-item/list(page=${currentPage - 1}, size=${pageSize},
               nomenclatureId=${filterNomenclatureId}, search=${filterSearch})}">← Назад</a>
        <span th:text="${currentPage + 1}"></span> из <span th:text="${totalPages}"></span>
        <a th:if="${currentPage < totalPages - 1}"
           th:href="@{/serial-item/list(page=${currentPage + 1}, size=${pageSize},
               nomenclatureId=${filterNomenclatureId}, search=${filterSearch})}">Вперед →</a>
    </div>
</div>

</body>
</html>
