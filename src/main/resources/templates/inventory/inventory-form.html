<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Новая инвентаризация - WarehouseApp</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 25px;
        }

        .btn {
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background-color: #3498db;
            color: white;
        }
        .btn-primary:hover {
            background-color: #2980b9;
        }

        .btn-secondary {
            background-color: #95a5a6;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #7f8c8d;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 500;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        .text-danger {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 6px;
            display: block;
        }

        .flash-message {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            border-left: 5px solid;
        }

        .flash-success {
            background-color: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }

        .flash-error {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }

        hr {
            border: 0;
            height: 1px;
            background: #eee;
            margin: 30px 0;
        }

        .help-text {
            color: #6c757d;
            font-size: 0.9rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Новая инвентаризация</h1>

    <div th:if="${successMessage}" class="flash-message flash-success">
        <b th:text="${successMessage}"></b>
    </div>

    <div th:if="${error}" class="flash-message flash-error">
        <b>Ошибка:</b> <span th:text="${error}"></span>
    </div>

    <form th:action="@{/inventory}" th:object="${inventoryForm}" method="post" class="form-card">

        <div class="form-group">
            <label for="warehouseId" class="form-label">Склад для инвентаризации</label>
            <select id="warehouseId" name="warehouseId" required>
                <option value="" disabled selected>Выберите склад</option>
                <option th:each="w : ${warehouses}"
                        th:value="${w.id}"
                        th:text="${w.name + ' (' + w.type + ')'}"></option>
            </select>

            <div th:if="${#fields.hasErrors('warehouseId')}" class="text-danger">
                <span th:errors="*{warehouseId}"></span>
            </div>
        </div>

        <div style="display: flex; gap: 15px;">
            <button type="submit" class="btn btn-primary">Создать инвентаризацию</button>
            <a href="/" class="btn btn-secondary">Отмена</a>
        </div>
    </form>

    <hr>
    <p class="help-text">
        При создании система автоматически сформирует строки инвентаризации на основе текущих остатков на выбранном складе.
        Если остатков нет, будет создан пустой черновик.
    </p>
</div>

</body>
</html>
