<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Выбор поставщика - Приход</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; max-width: 1200px; margin: 0 auto; background-color: #f4f6f9; }
        h1 { text-align: center; color: #2c3e50; margin-top: 20px; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f5f5f5; }
        tr:hover { background-color: #fafafa; }
        .active { color: green; font-weight: bold; }
        .inactive { color: #999; font-weight: bold; }
        .btn { padding: 6px 14px; text-decoration: none; color: white; border-radius: 4px; font-size: 14px; display: inline-block; border: none; cursor: pointer; }
        .btn-select { background-color: #2ecc71; }
        .btn-create { background-color: #28a745; display: inline-block; margin-top: 10px; padding: 8px 16px; }
        .btn-back { background-color: #6c757d; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .search-form { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .search-form input[type="text"] { padding: 8px 10px; width: 180px; border: 1px solid #ddd; border-radius: 4px; }
        .search-form button { padding: 8px 16px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .search-form a { padding: 8px 14px; background-color: #95a5a6; color: white; border-radius: 4px; text-decoration: none; font-size: 14px; }
        .pagination { display: flex; gap: 8px; margin-top: 20px; align-items: center; }
        .pagination a, .pagination span { padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px; text-decoration: none; color: #333; background: white; }
        .alert { padding: 12px 20px; border-radius: 4px; margin-top: 15px; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .not-found { text-align: center; padding: 20px; color: #7f8c8d; }
    </style>
</head>
<body>

<h1>Выберите поставщика для прихода</h1>

<div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<div class="top-bar">
    <form class="search-form" th:action="@{/movements/counterparty/list}" method="get">
        <input type="hidden" name="nomenclatureId" th:value="${nomenclatureId}">
        <input type="hidden" name="nomenclatureName" th:value="${nomenclatureName}">
        <input type="hidden" name="inventoryType" th:value="${inventoryType}">
        <input type="text" name="name" th:value="${filterName}" placeholder="Название"/>
        <button type="submit">Найти</button>
        <a th:href="@{/movements/counterparty/list(nomenclatureId=${nomenclatureId}, nomenclatureName=${nomenclatureName}, inventoryType=${inventoryType})}">Сбросить</a>
    </form>
    <a th:href="@{/movements/receipt/form}" class="btn btn-back">Назад к приходу</a>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Название</th>
        <th>ИНН</th>
        <th>Тип</th>
        <th>Статус</th>
        <th>Действие</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${counterparties}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.name}"></td>
        <td th:text="${c.inn}"></td>
        <td th:text="${c.counterpartyTypeLabel}"></td>
        <td>
            <span th:if="${c.isActive}" class="active">Активен</span>
            <span th:unless="${c.isActive}" class="inactive">Неактивен</span>
        </td>
        <td>
            <a th:href="@{/movements/receipt/form(nomenclatureId=${nomenclatureId}, nomenclatureName=${nomenclatureName}, counterpartyId=${c.id}, counterpartyName=${c.name}, inventoryType=${inventoryType})}"
               class="btn btn-select">Выбрать</a>
        </td>
    </tr>
    <tr th:if="${searchPerformed and #lists.isEmpty(counterparties)}">
        <td colspan="6" class="not-found">
            По запросу «<b th:text="${filterName}"></b>» ничего не найдено.
            <a th:href="@{/counterparty/create(from='movements', name=${filterName})}"
               class="btn btn-create">Создать контрагента</a>
        </td>
    </tr>
    <tr th:if="${not searchPerformed and #lists.isEmpty(counterparties)}">
        <td colspan="6" class="not-found">Контрагентов пока нет</td>
    </tr>
    </tbody>
</table>

<div class="pagination" th:if="${totalPages > 1}">
    <a th:if="${currentPage > 0}"
       th:href="@{/movements/counterparty/list(page=${currentPage - 1}, size=${pageSize}, name=${filterName}, nomenclatureId=${nomenclatureId}, nomenclatureName=${nomenclatureName}, inventoryType=${inventoryType})}">← Назад</a>
    <span>Стр. <span th:text="${currentPage + 1}"></span> из <span th:text="${totalPages}"></span></span>
    <a th:if="${currentPage < totalPages - 1}"
       th:href="@{/movements/counterparty/list(page=${currentPage + 1}, size=${pageSize}, name=${filterName}, nomenclatureId=${nomenclatureId}, nomenclatureName=${nomenclatureName}, inventoryType=${inventoryType})}">Вперёд →</a>
</div>

</body>
</html>
