<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Создать пользователя - WarehouseApp</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f6f9; padding: 20px; }
        .form-container { max-width: 500px; margin: 0 auto; background: white; padding: 32px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 24px; }
        label { display: block; margin-top: 16px; font-weight: 500; color: #333; }
        input[type="text"], input[type="email"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .error { color: #e74c3c; font-size: 0.85rem; margin-top: 6px; }
        button { margin-top: 24px; width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
        button:hover { background-color: #2980b9; }
        .back-link { display: block; text-align: center; margin-top: 16px; color: #7f8c8d; }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Создать пользователя</h2>

    <form th:action="@{/user/save}" method="post" th:object="${userRequest}">
        <label for="username">Логин (username)</label>
        <input type="text" id="username" name="username" th:field="*{username}" placeholder="Например: ivanov_aa" required/>
        <span class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" th:field="*{email}" placeholder="example@company.com" required/>
        <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

        <label for="role">Роль</label>
        <select id="role" name="role" th:field="*{role}">
            <option value="" disabled selected>Выберите роль</option>
            <option th:value="${T(com.example.warehouseApp.domain.User.Role).ADMIN}" value="ADMIN">Администратор (полный доступ)</option>
            <option th:value="${T(com.example.warehouseApp.domain.User.Role).STOREKEEPER}" value="STOREKEEPER">Кладовщик (операции, справочники)</option>
            <option th:value="${T(com.example.warehouseApp.domain.User.Role).VIEWER}" value="VIEWER">Просмотр (только отчёты)</option>
        </select>
        <span class="error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></span>

        <button type="submit">Сохранить пользователя</button>
    </form>

    <a class="back-link" th:href="@{/}">Вернуться на главную</a>
</div>
</body>
</html>
