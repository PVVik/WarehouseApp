<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Склад</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 1200px; margin: 0 auto; background-color: #f4f6f9; }
        h1 { text-align: center; color: #2c3e50; margin-top: 40px; margin-bottom: 10px; }
        h2 { color: #2c3e50; margin-top: 40px; margin-bottom: 15px; }
        .warehouse-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .field { margin-top: 15px; }
        .field strong { display: inline-block; width: 120px; color: #2c3e50; }
        .active { color: green; font-weight: bold; }
        .inactive { color: #999; font-weight: bold; }
        .actions { margin-top: 30px; }
        .btn { padding: 8px 16px; text-decoration: none; border-radius: 4px; color: white; font-size: 14px; display: inline-block; }
        .btn-edit { background-color: #007bff; }
        .btn-back { background-color: #6c757d; margin-left: 10px; }
        .btn-create { background-color: #28a745; }
        .btn-delete { background-color: #dc3545; border: none; cursor: pointer; font-size: 14px; padding: 6px 14px; border-radius: 4px; color: white; }
        .btn-cell-edit { background-color: #007bff; padding: 6px 14px; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f5f5f5; }
        tr:hover { background-color: #fafafa; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .search-form { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .search-form input[type="text"] { padding: 8px 10px; width: 150px; border: 1px solid #ddd; border-radius: 4px; }
        .search-form select { padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; }
        .search-form button { padding: 8px 16px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .search-form a { padding: 8px 14px; background-color: #95a5a6; color: white; border-radius: 4px; text-decoration: none; font-size: 14px; }
        .used { color: #dc3545; font-weight: bold; }
        .free { color: #28a745; font-weight: bold; }
        .alert { padding: 12px 20px; border-radius: 4px; margin-top: 15px; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .pagination { display: flex; gap: 8px; margin-top: 20px; align-items: center; }
        .pagination a, .pagination span { padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px; text-decoration: none; color: #333; background: white; }
        .pagination .current { background-color: #3498db; color: white; border-color: #3498db; }
    </style>
</head>
<body>

<h1 th:text="${warehouse.name}">Склад</h1>

<div class="warehouse-card">
    <div class="field"><strong>ID:</strong> <span th:text="${warehouse.id}"></span></div>
    <div class="field"><strong>Адрес:</strong> <span th:text="${warehouse.address}"></span></div>
    <div class="field"><strong>Тип:</strong> <span th:text="${warehouse.type}"></span></div>
    <div class="field">
        <strong>Статус:</strong>
        <span th:if="${warehouse.active}" class="active">Активен</span>
        <span th:unless="${warehouse.active}" class="inactive">Неактивен</span>
    </div>

    <div class="actions">
        <a th:href="@{/warehouse/{id}/edit(id=${warehouse.id})}" class="btn btn-edit">Редактировать</a>
        <a th:href="@{/warehouse}" class="btn btn-back">Назад к списку</a>
    </div>
</div>

<div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

<h2>Ячейки хранения</h2>

<a th:href="@{/warehouse/{id}/locations/bulk(id=${warehouse.id})}" class="btn" style="background-color: #27ae60; color: white;">
    + Создать ячейки массово
</a>


<div class="top-bar">
    <form class="search-form" th:action="@{/warehouse/{id}(id=${warehouse.id})}" method="get">
        <input type="text" name="zone" th:value="${filterZone}" placeholder="Зона"/>
        <input type="text" name="rack" th:value="${filterRack}" placeholder="Стеллаж"/>
        <input type="text" name="shelf" th:value="${filterShelf}" placeholder="Полка"/>
        <select name="used">
            <option value="">— Статус —</option>
            <option value="true" th:selected="${filterUsed != null and filterUsed == true}">Занята</option>
            <option value="false" th:selected="${filterUsed != null and filterUsed == false}">Свободна</option>
        </select>
        <button type="submit">Найти</button>
        <a th:href="@{/warehouse/{id}(id=${warehouse.id})}">Сбросить</a>
    </form>
    <a th:href="@{/storageLocation/create(warehouseId=${warehouse.id})}" class="btn btn-create">+ Добавить ячейку</a>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Код</th>
        <th>Зона</th>
        <th>Стеллаж</th>
        <th>Полка</th>
        <th>Статус</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="loc : ${storageLocations}">
        <td th:text="${loc.id}"></td>
        <td th:text="${loc.code}"></td>
        <td th:text="${loc.zone}"></td>
        <td th:text="${loc.rack}"></td>
        <td th:text="${loc.shelf}"></td>
        <td>
            <span th:if="${loc.used}" class="used">Занята</span>
            <span th:unless="${loc.used}" class="free">Свободна</span>
        </td>
        <td>
            <a th:href="@{/storageLocation/edit/{id}(id=${loc.id})}" class="btn btn-cell-edit">Изменить</a>
            <form th:action="@{/storageLocation/delete/{id}(id=${loc.id})}" method="post" style="display: inline;">
                <input type="hidden" name="warehouseId" th:value="${warehouse.id}">
                <button type="submit" class="btn-delete"
                        onclick="return confirm('Удалить ячейку?')">Удалить</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(storageLocations)}">
        <td colspan="7" style="text-align: center;">Ячеек пока нет</td>
    </tr>
    </tbody>
</table>

<div class="pagination" th:if="${totalPages > 1}">
    <a th:if="${currentPage > 0}"
       th:href="@{/warehouse/{id}(id=${warehouse.id}, page=${currentPage - 1}, size=${pageSize}, zone=${filterZone}, rack=${filterRack}, shelf=${filterShelf}, used=${filterUsed})}">← Назад</a>
    <span class="current">Стр. <span th:text="${currentPage + 1}"></span> из <span th:text="${totalPages}"></span></span>
    <a th:if="${currentPage < totalPages - 1}"
       th:href="@{/warehouse/{id}(id=${warehouse.id}, page=${currentPage + 1}, size=${pageSize}, zone=${filterZone}, rack=${filterRack}, shelf=${filterShelf}, used=${filterUsed})}">Вперёд →</a>
</div>

</body>
</html>
