<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Склад</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            background-color: #f4f6f9;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-top: 40px;
            margin-bottom: 10px;
        }

        h2 {
            color: #2c3e50;
            margin-top: 40px;
            margin-bottom: 15px;
        }

        .warehouse-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .field {
            margin-top: 15px;
        }

        .field strong {
            display: inline-block;
            width: 120px;
            color: #2c3e50;
        }

        .active {
            color: green;
            font-weight: bold;
        }

        .inactive {
            color: #999;
            font-weight: bold;
        }

        .used {
            color: #dc3545;
            font-weight: bold;
        }

        .free {
            color: #28a745;
            font-weight: bold;
        }

        .btn {
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            color: white;
            font-size: 14px;
            display: inline-block;
            border: none;
            cursor: pointer;
        }

        .btn-edit {
            background-color: #3498db;
            width: 100px;
            text-align: center;
        }

        .btn-back {
            background-color: #6c757d;
            width: 100px;
            text-align: center;
        }

        .btn-create {
            background-color: #3498db;
        }

        .btn-bulk {
            background-color: #3498db;
        }

        .btn-cell-edit {
            background-color: #3498db;
            padding: 6px 14px;
            font-size: 14px;
        }

        .btn-delete {
            background-color: #3498db;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 6px 14px;
            border-radius: 4px;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f5f5f5;
        }

        tr:hover {
            background-color: #fafafa;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .search-form {
            display: flex;
            gap: 8px;
            align-items: stretch;
            flex-grow: 1;
            width: 100%;
            box-sizing: border-box;
        }

        .search-form input[type="text"],
        .search-form select {
            height: 36px;
            box-sizing: border-box;
            padding: 0 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            flex: 1 1 140px;
        }

        .search-form .search-btn {
            height: 36px;
            box-sizing: border-box;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            flex: 1 1 140px;
            white-space: nowrap;
            text-align: center;
        }

        .search-form .search-reset {
            height: 36px;
            box-sizing: border-box;
            background-color: #6c757d;
            color: white;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
            flex: 1 1 140px;
            white-space: nowrap;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .alert {
            padding: 12px 20px;
            border-radius: 4px;
            margin-top: 15px;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .pagination {
            display: flex;
            gap: 8px;
            margin-top: 20px;
            align-items: center;
        }

        .pagination a, .pagination span {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-decoration: none;
            color: #333;
            background: white;
        }

        .pagination .current {
            background-color: #3498db;
            color: white;
            border-color: #3498db;
        }
    </style>
</head>
<body>

<h1 th:text="${warehouse != null ? warehouse.name : 'Склад'}">Склад</h1>

<div th:if="${warehouse != null}" class="warehouse-card">
    <div class="field"><strong>ID:</strong> <span th:text="${warehouse.id}"></span></div>
    <div class="field"><strong>Адрес:</strong> <span th:text="${warehouse.address}"></span></div>
    <div class="field"><strong>Тип:</strong> <span th:text="${warehouse.type}"></span></div>
    <div class="field">
        <strong>Статус:</strong>
        <span th:if="${warehouse.active}" class="active">Активен</span>
        <span th:unless="${warehouse.active}" class="inactive">Неактивен</span>
    </div>

    <div style="margin-top: 20px;">
        <div sec:authorize="hasAnyRole('ADMIN', 'STOREKEEPER')">
            <a th:href="@{/warehouse/{id}/edit(id=${warehouse.id})}" class="btn btn-edit">Редактировать</a>
        </div>
    </div>
    <div style="margin-top: 20px;">
        <div><a th:href="@{/warehouse}" class="btn btn-back">Назад</a>
        </div>
    </div>
</div>

<div th:if="${message != null and !#strings.isEmpty(message)}" class="alert alert-success" th:text="${message}"></div>

<h2>Ячейки хранения</h2>
<div class="top-bar">
    <div sec:authorize="hasAnyRole('ADMIN', 'STOREKEEPER')">
        <a th:href="@{/warehouse/{id}/locations/bulk(id=${warehouse != null ? warehouse.id : ''})}"
           class="btn btn-bulk">
            + Создать ячейки массово
        </a>
    </div>
    <div style="display: flex; justify-content: flex-end;">
        <div sec:authorize="hasAnyRole('ADMIN', 'STOREKEEPER')">
            <a th:href="@{/storageLocation/create(warehouseId=${warehouse != null ? warehouse.id : ''})}"
               class="btn btn-create">+ Добавить ячейку</a>
        </div>
    </div>
</div>

<div class="top-bar">
    <form class="search-form" th:action="@{/warehouse/{id}(id=${warehouse != null ? warehouse.id : ''})}" method="get">
        <input type="text" name="zone" th:value="${filterZone != null ? filterZone : ''}" placeholder="Зона"/>
        <input type="text" name="rack" th:value="${filterRack != null ? filterRack : ''}" placeholder="Стеллаж"/>
        <input type="text" name="shelf" th:value="${filterShelf != null ? filterShelf : ''}" placeholder="Полка"/>
        <select name="used">
            <option value="">— Статус —</option>
            <option value="true" th:selected="${filterUsed != null and filterUsed == true}">Занята</option>
            <option value="false" th:selected="${filterUsed != null and filterUsed == false}">Свободна</option>
        </select>
        <button type="submit" class="search-btn">Найти</button>
        <a th:href="@{/warehouse/{id}(id=${warehouse != null ? warehouse.id : ''})}"
           class="search-reset">Сбросить</a>
    </form>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Код</th>
        <th>Зона</th>
        <th>Стеллаж</th>
        <th>Полка</th>
        <th>Статус</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${storageLocations == null or #lists.isEmpty(storageLocations)}">
        <td colspan="7" style="text-align: center;">Ячеек пока нет</td>
    </tr>

    <tr th:each="loc : ${storageLocations}" th:unless="${storageLocations == null}">
        <td th:text="${loc.id}"></td>
        <td th:text="${loc.code}"></td>
        <td th:text="${loc.zone}"></td>
        <td th:text="${loc.rack}"></td>
        <td th:text="${loc.shelf}"></td>
        <td>
            <span th:if="${loc.used}" class="used">Занята</span>
            <span th:unless="${loc.used}" class="free">Свободна</span>
        </td>
        <td>
            <div sec:authorize="hasAnyRole('ADMIN', 'STOREKEEPER')">
                <div style="display: flex; gap: 8px;">
                    <a th:href="@{/storageLocation/edit/{id}(id=${loc.id})}" class="btn btn-cell-edit">Изменить</a>

                    <form th:action="@{/storageLocation/delete/{id}(id=${loc.id})}" method="post"
                          style="display: inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn-delete"
                                onclick="return confirm('Вы уверены, что хотите удалить ячейку ID: ' + ${loc.id} + '?');">
                            Удалить
                        </button>
                    </form>
                </div>
            </div>
        </td>
    </tr>
    </tbody>
</table>

<div th:if="${totalPages != null and totalPages > 1}">
    <div class="pagination">
        <a th:if="${currentPage != null and currentPage > 0}"
           th:href="@{/warehouse/{id}(id=${warehouse != null ? warehouse.id : ''}, page=${currentPage - 1}, size=${pageSize != null ? pageSize : 10}, zone=${filterZone != null ? filterZone : ''}, rack=${filterRack != null ? filterRack : ''}, shelf=${filterShelf != null ? filterShelf : ''}, used=${filterUsed != null ? filterUsed : ''})}">←
            Назад</a>

        <span class="current">Стр. <span th:text="${currentPage != null ? (currentPage + 1) : 1}"></span> из <span
                th:text="${totalPages}"></span></span>

        <a th:if="${currentPage != null and currentPage < totalPages - 1}"
           th:href="@{/warehouse/{id}(id=${warehouse != null ? warehouse.id : ''}, page=${currentPage + 1}, size=${pageSize != null ? pageSize : 10}, zone=${filterZone != null ? filterZone : ''}, rack=${filterRack != null ? filterRack : ''}, shelf=${filterShelf != null ? filterShelf : ''}, used=${filterUsed != null ? filterUsed : ''})}">Вперёд
            →</a>
    </div>
</div>

</body>
</html>
