<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форма склада</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input[type="text"], select { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        .checkbox-row { margin-top: 15px; display: flex; align-items: center; gap: 8px; }
        .checkbox-row label { margin: 0; font-weight: normal; }
        .error { color: red; font-size: 14px; display: block; margin-top: 3px; }
        .actions { margin-top: 25px; }
        .btn-save { padding: 10px 24px; background-color: #007bff; color: white;
            border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .btn-cancel { margin-left: 10px; color: #555; text-decoration: none; }
    </style>
</head>
<body>

<h1 th:text="${warehouseDto.id != null ? 'Редактировать склад' : 'Новый склад'}"></h1>

<form th:action="@{/warehouse}" th:object="${warehouseDto}" method="post">

    <input type="hidden" th:if="${warehouseDto.id != null}" th:field="*{id}"/>
    <input type="hidden" name="from" th:value="${from}">

    <label for="name">Название</label>
    <input type="text" id="name" th:field="*{name}" placeholder="Название склада"/>
    <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>

    <label for="address">Адрес</label>
    <input type="text" id="address" th:field="*{address}" placeholder="Адрес склада"/>
    <span class="error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>

    <label for="type">Тип склада</label>
    <select id="type" th:field="*{type}">
        <option value="" selected disabled>Выберите тип</option>
        <option th:each="t : ${T(com.example.WarehouseApp.model.WarehouseType).values()}"
                th:value="${t}" th:text="${t}"></option>
    </select>
    <span class="error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></span>

    <div class="checkbox-row">
        <input type="checkbox" id="active" th:field="*{active}"/>
        <label for="active">Активен</label>
    </div>

    <div class="actions">
        <button type="submit" class="btn-save">Сохранить</button>
        <a th:href="${from == 'movements'} ? @{/movements/warehouse/list} : @{/warehouse}"
           class="btn-cancel">Отмена</a>
    </div>

</form>


</body>
</html>
