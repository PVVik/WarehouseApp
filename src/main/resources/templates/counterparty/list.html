<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Контрагенты</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 1200px; margin: 0 auto; background-color: #f4f6f9; }
        h1 { text-align: center; color: #2c3e50; margin-top: 40px; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f5f5f5; }
        tr:hover { background-color: #fafafa; }
        .active { color: green; font-weight: bold; }
        .inactive { color: #999; font-weight: bold; }
        .btn { padding: 6px 14px; text-decoration: none; color: white; border-radius: 4px; font-size: 14px; display: inline-block; }
        .btn-create { background-color: #28a745; display: inline-block; margin-bottom: 15px; padding: 8px 16px; }
        .btn-edit { background-color: #007bff; }
        .btn-delete { background-color: #dc3545; border: none; cursor: pointer; font-size: 14px; padding: 6px 14px; border-radius: 4px; color: white; }
        .btn-back { background-color: #6c757d; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .toolbar-left { display: flex; align-items: center; gap: 10px; }
        .search-form { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .search-form input[type="text"] { padding: 8px 10px; width: 180px; border: 1px solid #ddd; border-radius: 4px; }
        .search-form select { padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; }
        .search-form button { padding: 8px 16px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .search-form a { padding: 8px 14px; background-color: #95a5a6; color: white; border-radius: 4px; text-decoration: none; font-size: 14px; }
        .pagination { display: flex; gap: 8px; margin-top: 20px; align-items: center; }
        .pagination a, .pagination span { padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px; text-decoration: none; color: #333; background: white; }
        .pagination .current { background-color: #3498db; color: white; border-color: #3498db; }
        .alert { padding: 12px 20px; border-radius: 4px; margin-top: 15px; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<h1>Контрагенты</h1>

<div class="top-bar">
    <div class="toolbar-left">
        <a th:href="@{/}" class="btn btn-back">← Назад к операциям</a>
    </div>
    <form class="search-form" th:action="@{/counterparty}" method="get">
        <input type="text" name="name" th:value="${filterName}" placeholder="Название"/>
        <input type="text" name="inn" th:value="${filterInn}" placeholder="ИНН"/>
        <select name="counterpartyType">
            <option value="">— Тип —</option>
            <option th:each="t : ${counterpartyTypes}"
                    th:value="${t}"
                    th:text="${t.label}"
                    th:selected="${filterType != null and filterType == t.toString()}"></option>
        </select>
        <button type="submit">Найти</button>
        <a th:href="@{/counterparty}">Сбросить</a>
    </form>
    <a th:href="@{/counterparty/create}" class="btn btn-create">+ Добавить контрагента</a>
</div>

<div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Название</th>
        <th>ИНН</th>
        <th>КПП</th>
        <th>Тип</th>
        <th>Телефон</th>
        <th>Контактное лицо</th>
        <th>Статус</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${counterparties}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.name}"></td>
        <td th:text="${c.inn}"></td>
        <td th:text="${c.kpp}"></td>
        <td th:text="${c.counterpartyTypeLabel}"></td>
        <td th:text="${c.phone}"></td>
        <td th:text="${c.contact}"></td>
        <td>
            <span th:if="${c.isActive}" class="active">Активен</span>
            <span th:unless="${c.isActive}" class="inactive">Неактивен</span>
        </td>
        <td>
            <a th:href="@{/counterparty/edit/{id}(id=${c.id})}" class="btn btn-edit">Редактировать</a>
            <form th:action="@{/counterparty/delete/{id}(id=${c.id})}" method="post" style="display: inline;">
                <button type="submit" class="btn-delete"
                        onclick="return confirm('Удалить контрагента?')">Удалить</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(counterparties)}">
        <td colspan="9" style="text-align: center;">Контрагентов пока нет</td>
    </tr>
    </tbody>
</table>

<div class="pagination" th:if="${totalPages > 1}">
    <a th:if="${currentPage > 0}"
       th:href="@{/counterparty(page=${currentPage - 1}, size=${pageSize}, name=${filterName}, inn=${filterInn}, counterpartyType=${filterType}, active=${filterActive})}">← Назад</a>
    <span class="current">Стр. <span th:text="${currentPage + 1}"></span> из <span th:text="${totalPages}"></span></span>
    <a th:if="${currentPage < totalPages - 1}"
       th:href="@{/counterparty(page=${currentPage + 1}, size=${pageSize}, name=${filterName}, inn=${filterInn}, counterpartyType=${filterType}, active=${filterActive})}">Вперёд →</a>
</div>

</body>
</html>
