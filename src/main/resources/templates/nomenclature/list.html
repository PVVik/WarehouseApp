<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Номенклатура - WarehouseApp</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .toolbar {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .filter-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            align-items: end;
        }

        .btn {
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-primary { background-color: #3498db; color: white; }
        .btn-primary:hover { background-color: #2980b9; }

        .btn-success { background-color: #2ecc71; color: white; }
        .btn-danger { background-color: #e74c3c; color: white; }

        input[type="text"], select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f8f9fa;
            color: #2c3e50;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .pagination {
            margin-top: 20px;
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .pagination a, .pagination span {
            padding: 8px 12px;
            border: 1px solid #ddd;
            text-decoration: none;
            color: #333;
            border-radius: 4px;
        }

        .pagination .active {
            background-color: #3498db;
            color: white;
            border-color: #3498db;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .status-active {
            background-color: #d4edda;
            color: #155724;
        }

        .status-inactive {
            background-color: #f8d7da;
            color: #721c24;
        }

        .flash-message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
        }

        .flash-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .flash-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Номенклатура</h1>

    <div th:if="${successMessage}" class="flash-message flash-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="flash-message flash-error" th:text="${errorMessage}"></div>

    <div class="toolbar">
        <div>
            <h2>Список позиций</h2>
        </div>
        <form th:action="@{/nomenclature}" method="get" class="filter-form">
            <input type="text" name="name" th:value="${filterName}" placeholder="Название (например, Болт)" />

            <input type="text" name="sku" th:value="${filterSku}" placeholder="Артикул" />

            <select name="stuffCategory">
                <option value="">Все категории</option>
                <option th:each="cat : ${T(com.example.WarehouseApp.model.StuffCategory).values()}"
                        th:value="${cat.name()}"
                        th:text="${cat.label}"
                        th:selected="${cat.name() == filterStuffCategory}">
                </option>
            </select>

            <select name="active">
                <option value="">Любой статус</option>
                <option value="true" th:selected="${filterActive == true}">Активен</option>
                <option value="false" th:selected="${filterActive == false}">Неактивен</option>
            </select>

            <div style="display: flex; gap: 8px;">
                <button type="submit" class="btn btn-primary">Найти</button>
                <a th:href="@{/nomenclature}" class="btn btn-outline-secondary" style="background:none; color:#6c757d; text-decoration:none; padding: 8px 16px;">Сброс</a>
            </div>
        </form>

        <a href="/nomenclature/form" class="btn btn-primary">+ Добавить позицию</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>SKU</th>
            <th>Название</th>
            <th>Категория</th>
            <th>Ед. изм.</th>
            <th>Тип учета</th>
            <th>Статус</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${nomenclatureList}">
            <td th:text="${item.id}"></td>
            <td th:text="${item.sku}"></td>
            <td th:text="${item.name}"></td>

            <td th:text="${item.stuffCategoryLabel}"></td>

            <td th:text="${item.unitOfMeasureLabel}"></td>
            <td th:text="${item.inventoryTypeLabel}"></td>

            <td>
                <span th:classappend="${item.active} ? 'status-active' : 'status-inactive'"
                      class="status-badge"
                      th:text="${item.active} ? 'Активен' : 'Неактивен'">
                </span>
            </td>
            <td>
                <a th:href="@{/nomenclature/form(id=${item.id})}"
                   class="btn btn-sm"
                   style="background:none; color:#3498db; text-decoration:underline; padding:0;">
                    Редактировать
                </a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(nomenclatureList)}">
            <td colspan="8" style="text-align:center; color:#7f8c8d;">Список пуст</td>
        </tr>
        </tbody>
    </table>

    <div class="pagination" th:if="${totalPages > 1}">
        <a th:if="${currentPage > 0}"
           th:href="@{/nomenclature(page=${currentPage - 1}, size=${pageSize},
               name=${filterName}, sku=${filterSku},
               stuffCategory=${filterStuffCategory}, active=${filterActive})}">
            ← Назад
        </a>

        <span class="active" th:text="${currentPage + 1}"></span> из <span th:text="${totalPages}"></span>

        <a th:if="${currentPage < totalPages - 1}"
           th:href="@{/nomenclature(page=${currentPage + 1}, size=${pageSize},
               name=${filterName}, sku=${filterSku},
               stuffCategory=${filterStuffCategory}, active=${filterActive})}">
            Вперед →
        </a>
    </div>

    <p style="color: #7f8c8d; margin-top: 10px;">
        Всего элементов: <b th:text="${totalElements}"></b> | Страница: <b th:text="${currentPage + 1}"></b>
    </p>
</div>

</body>
</html>
