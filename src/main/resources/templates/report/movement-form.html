<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Параметры отчёта по движениям — Складская система</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-top: 40px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .page-header {
            margin-bottom: 30px;
            text-align: center;
        }

        .form-wrapper {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            margin: 0 auto 40px;
        }

        .form-intro {
            color: #7f8c8d;
            margin-bottom: 25px;
            line-height: 1.5;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            text-align: center;
            color: #2c3e50;
            font-weight: 500;
            font-size: 0.95rem;
        }

        input[type="date"], select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 1rem;
            color: #2c3e50;
            text-align: center;
            text-align-last: center;
        }

        input[type="date"]:focus, select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        .actions {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            box-sizing: border-box;
            height: 44px;
            padding: 0 20px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-primary {
            background-color: #3498db;
            color: white;
            box-shadow: 0 2px 6px rgba(52, 152, 219, 0.35);
        }

        .btn-primary:hover {
            background-color: #2980b9;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.4);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: #ecf0f1;
            color: #2c3e50;
        }

        .btn-secondary:hover {
            background-color: #bdc3c7;
            color: #fff;
        }

        .access-denied-container {
            text-align: center;
            padding: 60px 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .access-denied-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div sec:authorize="hasAnyRole('VIEWER', 'ADMIN', 'STOREKEEPER')">
    <div class="container">
        <div class="page-header">
            <h1>Отчёт по движениям товаров</h1>
        </div>

        <div class="form-wrapper">
            <p class="form-intro">
                Укажите период и склад. Данные сначала отобразятся на экране — затем их можно будет скачать в CSV.
            </p>

            <form th:action="@{/report/movement-view}" method="GET">

                <div class="form-group">
                    <label for="startDate">Дата начала периода</label>
                    <input type="date" id="startDate" name="startDate" required />
                </div>

                <div class="form-group">
                    <label for="endDate">Дата окончания периода</label>
                    <input type="date" id="endDate" name="endDate" required />
                </div>

                <div class="form-group">
                    <label for="warehouseId">Склад (опционально)</label>
                    <select id="warehouseId" name="warehouseId">
                        <option value="">Все склады</option>
                        <option th:each="w : ${warehouses}" th:value="${w.id}" th:text="${w.name}"></option>
                    </select>
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-primary">Показать отчёт</button>
                    <a th:href="@{/analytics}" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>

<div sec:authorize="!hasAnyRole('VIEWER', 'ADMIN', 'STOREKEEPER')" class="access-denied-container">
    <div class="access-denied-icon">🚫</div>
    <h2>Доступ запрещён</h2>
    <p>У вас недостаточно прав для формирования отчёта по движениям товаров.</p>
    <a th:href="@{/}" class="btn btn-secondary" style="width: auto; padding: 0 24px; margin-top: 10px;">Вернуться на главную</a>
</div>

</body>
</html>
