<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Параметры отчёта по движениям — Складская система</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1, h2 {
            color: #2c3e50;
        }

        .form-wrapper {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            margin: 40px auto;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
            font-size: 0.95rem;
        }

        input[type="date"], select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
            color: #333;
        }

        input[type="date"]:focus, select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        .actions {
            margin-top: 2rem;
            display: flex;
            gap: 15px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background-color: #2980b9;
        }

        .btn-secondary {
            background-color: #ecf0f1;
            color: #2c3e50;
            border: 1px solid #bdc3c7;
        }

        .btn-secondary:hover {
            background-color: #bdc3c7;
            color: #fff;
        }

        .page-header {
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="page-header">
        <h1>Отчёт по движениям товаров</h1>
    </div>

    <div class="form-wrapper">
        <p class="text-muted" style="color: #7f8c8d; margin-bottom: 25px; line-height: 1.5;">
            Укажите период и склад. Данные сначала отобразятся на экране — затем их можно будет скачать в CSV.
        </p>

        <form th:action="@{/report/movement-view}" method="GET">

            <div class="form-group">
                <label for="startDate">Дата начала периода</label>
                <input type="date" id="startDate" name="startDate" required />
            </div>

            <div class="form-group">
                <label for="endDate">Дата окончания периода</label>
                <input type="date" id="endDate" name="endDate" required />
            </div>

            <div class="form-group">
                <label for="warehouseId">Склад (опционально)</label>
                <select id="warehouseId" name="warehouseId">
                    <option value="">Все склады</option>
                    <option th:each="w : ${warehouses}" th:value="${w.id}" th:text="${w.name}"></option>
                </select>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">Показать отчёт</button>

                <a th:href="@{/analytics}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
