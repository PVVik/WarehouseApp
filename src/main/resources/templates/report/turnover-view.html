<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Отчёт по оборачиваемости (ABC)</title>
    <style>
        .filter-panel {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            border: 1px solid #ddd;
        }

        .form-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        label {
            font-weight: 600;
            color: #333;
        }

        input[type="number"], input[type="date"] {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        select {
            padding: 6px 10px;
            min-width: 220px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .submit-btn {
            padding: 8px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .submit-btn:hover {
            background-color: #0056b3;
        }

        .download-btn {
            padding: 7px 18px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .back-btn {
            display: inline-block;
            padding: 8px 16px;
            background-color: #f0f0f0;
            color: #333;
            text-decoration: none;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }

        .badge-a {
            background-color: #d4edda;
            color: #155724;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .badge-b {
            background-color: #fff3cd;
            color: #856404;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .badge-c {
            background-color: #f8d7da;
            color: #721c24;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .access-denied-container {
            text-align: center;
            padding: 60px 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .access-denied-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div sec:authorize="hasAnyRole('VIEWER', 'ADMIN', 'STOREKEEPER')">
    <div style="margin-bottom: 15px;">
        <a href="/analytics" class="back-btn">← Назад</a>
    </div>

    <form th:action="@{/report/turnover}" method="get" class="filter-panel">
        <div class="form-group">
            <label for="warehouseId">Склад:</label>
            <select id="warehouseId" name="warehouseId">
                <option value="" th:selected="${selectedWarehouseId == null}">-- Все склады --</option>
                <option th:each="wh : ${warehouses}"
                        th:value="${wh.id}"
                        th:text="${wh.name}"
                        th:selected="${selectedWarehouseId != null and selectedWarehouseId == wh.id}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="start">С:</label>
            <input type="date" id="start" name="start"
                   th:value="${#temporals.format(selectedStart, 'yyyy-MM-dd')}"
                   required/>
        </div>

        <div class="form-group">
            <label for="end">По:</label>
            <input type="date" id="end" name="end"
                   th:value="${#temporals.format(selectedEnd, 'yyyy-MM-dd')}"
                   required/>
        </div>

        <button type="submit" class="submit-btn">Сформировать отчёт</button>

        <button type="button" class="download-btn"
                onclick="downloadCsv()" style="margin-left: 10px;">
            📥 Скачать отчёт (CSV)
        </button>
    </form>

    <h2>Отчёт по оборачиваемости и ABC-анализу
        <th:block th:if="${selectedWarehouseId != null}">
            (склад №<span th:text="${selectedWarehouseId}"></span>)
        </th:block>
        <br>
        <small>Период:
            <span th:text="${#temporals.format(selectedStart, 'dd.MM.yyyy')}"></span>
            –
            <span th:text="${#temporals.format(selectedEnd, 'dd.MM.yyyy')}"></span>
        </small>
    </h2>

    <table>
        <thead>
        <tr style="background-color: #f8f9fa;">
            <th style="width: 80px; padding: 8px; text-align: left;">Группа ABC</th>
            <th style="padding: 8px; text-align: left;">Номенклатура</th>
            <th style="padding: 8px; text-align: right;">Расход (шт)</th>
            <th style="padding: 8px; text-align: right;">Ср. мес. расход (шт)</th>
            <th style="padding: 8px; text-align: right;">Сумма расхода (руб)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${turnoverList}">
            <td style="padding: 8px;">
                <span th:class="'badge-' + ${row.group.toLowerCase()}"
                      style="padding: 3px 6px; border-radius: 4px; font-weight: bold;">
                    <strong th:text="${row.group}"></strong>
                </span>
            </td>
            <td style="padding: 8px;" th:text="${row.nomenclatureName}"></td>

            <td style="padding: 8px; text-align: right;">
                <th:block th:if="${row.totalQuantity != null}">
                    <span th:text="${row.totalQuantity}"></span>
                </th:block>
                <th:block th:unless="${row.totalQuantity != null}">—</th:block>
            </td>

            <td style="padding: 8px; text-align: right;">
                <th:block th:if="${row.avgMonthlyQuantity != null}">
                    <span th:text="${row.avgMonthlyQuantity}"></span>
                </th:block>
                <th:block th:unless="${row.avgMonthlyQuantity != null}">—</th:block>
            </td>

            <td style="padding: 8px; text-align: right;">
                <th:block th:if="${row.totalAmount != null}">
                    <span th:text="${row.totalAmount}"></span>&nbsp;₽
                </th:block>
                <th:block th:unless="${row.totalAmount != null}">—</th:block>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(turnoverList)}">
            <td colspan="5" style="text-align: center; padding: 20px; color: #666;">
                Нет данных за выбранный период
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div sec:authorize="!hasAnyRole('VIEWER', 'ADMIN', 'STOREKEEPER')" class="access-denied-container">
    <div class="access-denied-icon">🚫</div>
    <h2>Доступ запрещён</h2>
    <p>У вас недостаточно прав для просмотра отчётов по оборачиваемости.</p>
    <a th:href="@{/}" class="btn btn-primary" style="
        padding: 9px 20px;
        background-color: #3498db;
        color: white;
        border-radius: 4px;
        text-decoration: none;">Вернуться на главную</a>
</div>

<script>
    function downloadCsv() {
        const warehouseId = document.getElementById('warehouseId').value;
        const start = document.getElementById('start').value;
        const end = document.getElementById('end').value;

        if (!start || !end) {
            alert('Укажите даты периода');
            return;
        }

        let url = '/api/reports/turnover/csv?startDate=' + start + '&endDate=' + end;

        if (warehouseId) {
            url += '&warehouseId=' + warehouseId;
        }

        window.location.href = url;
    }
</script>
</body>
</html>
