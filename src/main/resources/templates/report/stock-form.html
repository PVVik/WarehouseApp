<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Отчёты — Складская система</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h2.page-title {
            text-align: center;
            color: #2c3e50;
            margin-top: 40px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .custom-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            transition: transform 0.2s, box-shadow 0.2s;
            max-width: 600px;
            margin: 0 auto;
        }

        .custom-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 500;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            background-color: #ffffff;
            color: #2c3e50;
            font-size: 1rem;
            cursor: pointer;
            box-sizing: border-box;
        }

        select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: #3498db;
            color: white;
            width: 100%;
            text-align: center;
            border: none;
        }

        .btn-primary:hover {
            background-color: #2980b9;
        }

        .btn-outline-secondary {
            background-color: transparent;
            border: 1px solid #ccc;
            color: #555;
            width: auto;
            display: inline-block;
        }

        .btn-outline-secondary:hover {
            background-color: #f8f9fa;
            border-color: #999;
        }

        .access-denied-container {
            text-align: center;
            padding: 60px 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .access-denied-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div sec:authorize="hasAnyRole('VIEWER', 'ADMIN', 'STOREKEEPER')">
    <div class="container">
        <a th:href="@{/analytics}" class="back-link" style="
            display:inline-block; margin-bottom:15px; color:#3498db; text-decoration:none; font-weight:600;">
            ← Назад
        </a>

        <h2 class="page-title">Отчёт остатков по складу</h2>

        <form th:action="@{/report/stock-view}" method="get" class="custom-card">
            <div>
                <label for="warehouseId">Выберите склад:</label>
                <select name="warehouseId" id="warehouseId">
                    <option value="" disabled selected>-- Выберите склад --</option>
                    <option th:each="w : ${warehouses}"
                            th:value="${w.id}"
                            th:text="${w.name}"
                            th:selected="${selectedWarehouseId != null and selectedWarehouseId == w.id}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Показать на экране</button>
        </form>

        <div style="margin-top:20px; text-align:center;">
            <a th:href="@{/report/download-stock(warehouseId=${selectedWarehouseId})}"
               class="btn btn-outline-secondary"
               th:if="${selectedWarehouseId != null}">
                📥 Скачать отчёт (CSV)
            </a>
        </div>
    </div>
</div>

<div sec:authorize="!hasAnyRole('VIEWER', 'ADMIN', 'STOREKEEPER')" class="access-denied-container">
    <div class="access-denied-icon">🚫</div>
    <h2>Доступ запрещён</h2>
    <p>У вас недостаточно прав для работы с отчётами по остаткам.</p>
    <a th:href="@{/}" class="btn btn-outline-secondary" style="margin-top:10px;">Вернуться на главную</a>
</div>

</body>
</html>
